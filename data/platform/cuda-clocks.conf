#
# Drop-in for geezuz-platform.service, installed only when the memory clock benchmark's second attempt (overriding
# CUDA's default clocks) is the one that held the cards' memory at 9751 MHz under load.
[Service]
ExecStart=/usr/bin/nvidia-smi -i 0 --cuda-clocks=1
ExecStart=/usr/bin/nvidia-smi -i 1 --cuda-clocks=1
